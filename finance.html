<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💰 Enid's Finance Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Dancing+Script:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ✨ ENID SINCLAIR — Cotton Candy Pastel Re-skin ✨ */
:root{
  /* Cotton candy base */
  --bg:#FFF4FA;--bg2:#F5E8FF;--bg3:#EAF5FF;
  /* Pinks */
  --pink:#FF5FAE;--pink2:#FF8FCA;--pink3:#FFB8DC;
  --pink-pale:#FFE0F2;--pink-glow:rgba(255,95,174,.22);
  --bubblegum:#FF3FA0;--cotton:#FFD1EC;
  /* Lavender/purple */
  --purple:#B060F0;--purple2:#CC8AF5;--purple3:#E0C8FF;
  --purple-pale:#EEE0FF;
  /* Mint accent */
  --mint:#4DDDA8;--mint-deep:#028A5B;--mint-pale:rgba(77,221,168,.14);--mint-glow:rgba(77,221,168,.3);
  /* Other pastels */
  --sky:#63CEFF;--sky-pale:#D8F2FF;
  --yellow:#FFD84D;--yellow-pale:#FFFBE0;
  --peach:#FFA55C;--peach-pale:#FFF0E8;
  --red:#F0306A;--red-pale:rgba(240,48,106,.08);
  --amber:#F5A800;
  /* Text */
  --text:#3A1858;--text2:#8952B8;--text3:#C09DD8;
  /* Cards & borders */
  --border:rgba(255,95,174,.16);--border2:rgba(176,96,240,.28);
  --card:rgba(255,252,255,.86);--card2:rgba(255,248,253,.96);
  /* Shadows */
  --shadow:0 8px 32px rgba(255,95,174,.14),0 2px 8px rgba(176,96,240,.10);
  --shadow-hover:0 16px 48px rgba(255,95,174,.24),0 4px 16px rgba(176,96,240,.18);
  --mono:'DM Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{max-width:100vw;overflow-x:hidden;scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

/* Cotton candy background */
body::before{content:'';position:fixed;inset:0;z-index:0;background:
  radial-gradient(ellipse 80% 60% at 5% 3%,rgba(255,179,218,.42) 0%,transparent 55%),
  radial-gradient(ellipse 65% 55% at 95% 12%,rgba(195,140,248,.30) 0%,transparent 55%),
  radial-gradient(ellipse 70% 60% at 50% 98%,rgba(255,148,208,.28) 0%,transparent 60%),
  radial-gradient(ellipse 55% 45% at 12% 72%,rgba(162,220,255,.2) 0%,transparent 52%),
  radial-gradient(ellipse 50% 45% at 82% 78%,rgba(255,215,240,.36) 0%,transparent 50%),
  radial-gradient(ellipse 40% 35% at 45% 45%,rgba(220,195,255,.15) 0%,transparent 50%),
  linear-gradient(148deg,#FFF4FA 0%,#F5E8FF 38%,#EAF5FF 68%,#FFF0F8 100%);
  pointer-events:none}

/* Floating sparkle decoration */
body::after{content:'✦ ✧ ✦ ✧ ✦ ✧';position:fixed;top:8%;left:2%;font-size:.85rem;color:rgba(255,95,174,.22);animation:sparkledrift 18s ease-in-out infinite;pointer-events:none;z-index:0;letter-spacing:2px}
@keyframes sparkledrift{0%,100%{transform:translateY(0) rotate(0deg);opacity:.2}50%{transform:translateY(-18px) rotate(15deg);opacity:.42}}

.app{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:0 32px 100px}

/* Nav */
.header-nav{display:flex;align-items:center;justify-content:space-between;padding:28px 0 0;animation:fadeDown .6s ease both}
.back-btn{display:inline-flex;align-items:center;gap:7px;padding:9px 20px;border-radius:999px;border:1.5px solid rgba(255,95,174,.35);background:rgba(255,95,174,.10);color:var(--bubblegum);font-size:.78rem;font-weight:700;text-decoration:none;font-family:'DM Sans',sans-serif;transition:all .2s;box-shadow:0 2px 10px rgba(255,95,174,.12)}
.back-btn:hover{background:var(--pink-glow);transform:translateY(-2px);box-shadow:0 6px 20px rgba(255,95,174,.25)}
.nav-links{display:flex;gap:8px}
.nav-lnk{display:inline-flex;align-items:center;gap:5px;padding:8px 16px;border-radius:999px;border:1.5px solid rgba(176,96,240,.18);background:var(--card);color:var(--text2);font-size:.75rem;font-weight:600;text-decoration:none;transition:all .2s;backdrop-filter:blur(12px);box-shadow:0 2px 8px rgba(176,96,240,.08)}
.nav-lnk:hover{border-color:var(--purple2);color:var(--purple);transform:translateY(-2px);box-shadow:0 6px 16px rgba(176,96,240,.16)}

/* Hero */
.hero{padding:32px 0 20px;animation:fadeDown .7s .05s ease both;position:relative}
.hero-eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--purple2);margin-bottom:10px;font-family:var(--mono)}
.hero-title{font-family:'Dancing Script',cursive;font-size:clamp(2.2rem,5.5vw,3.5rem);font-weight:700;line-height:1.1;background:linear-gradient(125deg,var(--peach) 0%,var(--pink) 35%,var(--bubblegum) 60%,var(--purple) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 3px 12px rgba(255,95,174,.2))}
.hero-title span{-webkit-text-fill-color:transparent}
.hero-sub{font-size:.85rem;color:var(--text2);margin-top:8px;font-weight:500}
/* Sparkle in hero */
.hero::after{content:'✨';position:absolute;right:20px;top:28px;font-size:1.8rem;animation:sparkledrift 6s ease-in-out infinite;opacity:.65;pointer-events:none}

/* Period tabs */
.period-tabs-wrap{position:sticky;top:0;z-index:10;background:linear-gradient(to bottom,rgba(255,244,250,.96) 80%,transparent);padding:10px 0 0;margin-bottom:22px;backdrop-filter:blur(8px)}
.period-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.period-tabs::-webkit-scrollbar{display:none}
.period-tab{flex-shrink:0;padding:8px 16px;border-radius:999px;border:1.5px solid var(--border);background:var(--card);color:var(--text3);font-size:.78rem;font-weight:700;cursor:pointer;font-family:var(--mono);transition:all .2s cubic-bezier(.34,1.4,.64,1);white-space:nowrap;position:relative;backdrop-filter:blur(12px);box-shadow:0 2px 8px rgba(255,95,174,.08),0 1px 3px rgba(176,96,240,.06)}
.period-tab:hover{border-color:rgba(255,95,174,.35);color:var(--text2);transform:translateY(-2px);box-shadow:0 6px 18px rgba(255,95,174,.18)}
.period-tab.active{border-color:transparent;background:linear-gradient(135deg,var(--bubblegum),var(--pink2),var(--purple2));color:#fff;box-shadow:0 6px 22px rgba(255,63,160,.38),0 0 0 2px rgba(255,200,235,.35);transform:translateY(-2px)}
.period-tab.is-current::after{content:'✨NOW';position:absolute;top:-8px;right:-5px;font-size:.45rem;font-weight:900;background:linear-gradient(135deg,var(--yellow),var(--peach));color:#fff;border-radius:999px;padding:2px 6px;letter-spacing:.05em;box-shadow:0 2px 8px rgba(255,168,0,.4)}

/* Corkboard panel — wraps each category */
.cat-section{margin-bottom:32px;animation:fadeUp .4s ease both;border-radius:28px;padding:20px 20px 22px;border:1.5px solid rgba(255,95,174,.12);backdrop-filter:blur(10px);box-shadow:0 4px 24px rgba(255,95,174,.07),inset 0 1px 0 rgba(255,255,255,.8)}
.cat-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:10px 15px;border-radius:16px;background:var(--card2);border:1.5px solid var(--border);backdrop-filter:blur(10px);box-shadow:0 2px 10px rgba(255,95,174,.07)}
.cat-icon{font-size:1rem}
.cat-title{font-family:'DM Sans',sans-serif;font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--text2)}
.cat-line{flex:1;height:1.5px;background:linear-gradient(90deg,rgba(255,95,174,.25),rgba(176,96,240,.15),transparent);border-radius:999px}
.cat-total{font-family:var(--mono);font-size:.72rem;color:var(--text3);background:var(--pink-pale);padding:3px 10px;border-radius:999px;border:1px solid rgba(255,95,174,.2)}

/* Per-category corkboard tints */
[data-cat="cc"]{background:rgba(255,232,248,.55);border-color:rgba(255,95,174,.14)}
[data-cat="cc"] .cat-header{background:rgba(255,238,250,.96);border-color:rgba(255,95,174,.24)}
[data-cat="cc"] .cat-title{color:var(--bubblegum)}
[data-cat="loan"]{background:rgba(238,228,255,.55);border-color:rgba(176,96,240,.14)}
[data-cat="loan"] .cat-header{background:rgba(240,230,255,.96);border-color:rgba(176,96,240,.24)}
[data-cat="loan"] .cat-title{color:var(--purple)}
[data-cat="affirm"]{background:rgba(255,245,230,.55);border-color:rgba(255,165,92,.14)}
[data-cat="affirm"] .cat-header{background:rgba(255,245,232,.96);border-color:rgba(255,165,92,.24)}
[data-cat="affirm"] .cat-title{color:var(--peach)}
[data-cat="sub"]{background:rgba(228,255,245,.55);border-color:rgba(77,221,168,.14)}
[data-cat="sub"] .cat-header{background:rgba(232,255,248,.96);border-color:rgba(77,221,168,.24)}
[data-cat="sub"] .cat-title{color:var(--mint-deep)}
[data-cat="life"]{background:rgba(228,244,255,.55);border-color:rgba(99,206,255,.14)}
[data-cat="life"] .cat-header{background:rgba(232,247,255,.96);border-color:rgba(99,206,255,.24)}
[data-cat="life"] .cat-title{color:#0A92C2}

/* Category progress bar */
.cat-progress{display:flex;align-items:center;gap:10px;margin:-6px 0 12px;padding:0 4px}
.cp-bar{flex:1;height:5px;background:rgba(176,96,240,.1);border-radius:999px;overflow:hidden}
.cp-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--pink),var(--bubblegum),var(--purple2));transition:width .4s cubic-bezier(.34,1.4,.64,1)}
.cp-fill.full{background:linear-gradient(90deg,var(--mint),var(--mint-deep))}
.cp-text{font-family:var(--mono);font-size:.62rem;color:var(--text3);white-space:nowrap}
.cp-count{color:var(--text2);font-weight:700}
.cp-done{color:var(--mint-deep)}
.cp-left{color:var(--purple2)}

/* Items grid — corkboard card layout */
.items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}

/* Cloud cards ☁️ */
.cloud-card{position:relative;background:rgba(255,255,255,.92);border:1.5px solid rgba(255,95,174,.16);border-radius:22px;padding:16px 16px 14px;box-shadow:0 4px 18px rgba(255,95,174,.1),0 1px 4px rgba(176,96,240,.07),inset 0 1px 0 rgba(255,255,255,.9);transition:all .22s cubic-bezier(.34,1.4,.64,1);display:flex;flex-direction:column;gap:6px;backdrop-filter:blur(12px)}
.cloud-card::before{content:'✦';position:absolute;top:9px;right:11px;font-size:.5rem;color:rgba(255,95,174,.28);pointer-events:none}
.cloud-card:hover{transform:translateY(-4px) scale(1.01);box-shadow:0 10px 30px rgba(255,95,174,.2),0 3px 10px rgba(176,96,240,.1);border-color:rgba(255,95,174,.28)}
.cloud-card.checked{opacity:.45;background:rgba(232,255,248,.75);border-color:rgba(77,221,168,.25);box-shadow:none}
.cloud-card.checked::before{content:'✓';color:rgba(77,221,168,.5)}
.cloud-card.cc-cleared{opacity:.45;background:rgba(232,255,248,.75);border-color:rgba(77,221,168,.25);box-shadow:none}
.cloud-card.paid-off-cloud{opacity:.3;border-style:dashed;border-color:var(--mint);pointer-events:none;background:rgba(232,255,248,.5)}

/* Cloud card inner elements */
.cloud-check-wrap{position:absolute;top:10px;right:10px}
.cloud-amount{font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:900;color:var(--text);line-height:1;padding-right:28px}
.cloud-amount.final-pay{color:var(--mint-deep)}
.cloud-amount.cleared-lbl{font-size:.85rem;color:var(--mint-deep)}
.cloud-name{font-size:.82rem;font-weight:700;color:var(--text);line-height:1.3}
.cloud-card.checked .cloud-name,.cloud-card.cc-cleared .cloud-name{text-decoration:line-through;text-decoration-color:rgba(2,138,91,.3);color:var(--mint-deep)}
.cloud-note{font-size:.63rem;color:var(--text3);font-family:var(--mono);line-height:1.4;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cloud-footer{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.item-due{font-family:var(--mono);font-size:.63rem;color:var(--text3);white-space:nowrap}

/* Checkbox */
.item-check{width:22px;height:22px;min-width:22px;border:2px solid rgba(176,96,240,.28);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .25s cubic-bezier(.34,1.56,.64,1);background:rgba(255,255,255,.8);user-select:none}
.item-check:hover{border-color:var(--pink2);transform:scale(1.12);box-shadow:0 0 8px rgba(255,95,174,.25)}
.item-check.done{border-color:var(--pink);background:linear-gradient(135deg,var(--pink),var(--bubblegum));transform:scale(1.12);box-shadow:0 0 14px rgba(255,95,174,.5)}
.item-check.done::after{content:'✓';font-size:.65rem;color:#fff;font-weight:900}

/* APR badges */
.apr-badge{font-family:var(--mono);font-size:.62rem;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.apr-crit{background:rgba(240,48,106,.1);color:var(--red);border:1.5px solid rgba(240,48,106,.28)}
.apr-high{background:rgba(255,165,92,.12);color:var(--peach);border:1.5px solid rgba(255,165,92,.28)}
.apr-mid{background:rgba(245,168,0,.1);color:var(--amber);border:1.5px solid rgba(245,168,0,.25)}
.apr-low{background:rgba(77,221,168,.12);color:var(--mint-deep);border:1.5px solid rgba(77,221,168,.32)}
.apr-zero{background:var(--mint-pale);color:var(--mint-deep);border:1.5px solid rgba(77,221,168,.35)}
.final-badge{font-size:.58rem;font-weight:700;padding:3px 8px;border-radius:999px;background:linear-gradient(135deg,rgba(255,95,174,.1),rgba(176,96,240,.1));color:var(--purple);border:1.5px solid rgba(176,96,240,.28);white-space:nowrap}

/* CC dual-checkbox — pill buttons at card bottom */
.cc-checks{display:flex;gap:8px;margin-top:auto;padding-top:6px}
.cc-check-item{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;flex:1;padding:6px 4px;border-radius:12px;border:1.5px solid rgba(176,96,240,.12);background:rgba(255,255,255,.55);transition:all .18s}
.cc-check-item:hover{border-color:rgba(176,96,240,.28);background:rgba(255,255,255,.85);transform:translateY(-1px)}
.cc-cb{width:20px;height:20px;border:2px solid rgba(176,96,240,.25);border-radius:6px;display:flex;align-items:center;justify-content:center;transition:all .18s;background:rgba(255,255,255,.65);user-select:none}
.cc-cb.sched{border-color:var(--amber);background:rgba(245,168,0,.12)}
.cc-cb.sched::after{content:'📅';font-size:.55rem;line-height:1}
.cc-cb.cleared{border-color:var(--mint-deep);background:var(--mint-pale)}
.cc-cb.cleared::after{content:'✓';font-size:.7rem;color:var(--mint-deep);font-weight:900}
.cc-cb-lbl{font-size:.52rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text3);font-family:var(--mono);white-space:nowrap}
.cc-check-item:has(.cc-cb.sched) .cc-cb-lbl{color:var(--amber)}
.cc-check-item:has(.cc-cb.cleared) .cc-cb-lbl{color:var(--mint-deep)}

/* Variable spending cloud */
.var-budget-lbl{font-family:var(--mono);font-size:.63rem;color:var(--text3)}
.var-prefix{font-family:var(--mono);font-size:.72rem;color:var(--text3)}
.var-input-row{display:flex;align-items:center;gap:5px}
.var-input{flex:1;min-width:0;background:rgba(255,255,255,.78);border:1.5px solid var(--border);border-radius:8px;padding:5px 8px;font-family:var(--mono);font-size:.8rem;color:var(--text);outline:none;text-align:right;transition:all .2s}
.var-input:focus{border-color:var(--pink2);box-shadow:0 0 0 2px var(--pink-glow)}
.var-bar{height:5px;background:rgba(176,96,240,.1);border-radius:999px;overflow:hidden}
.var-fill{height:100%;border-radius:999px;transition:width .4s cubic-bezier(.34,1.4,.64,1);background:linear-gradient(90deg,var(--pink),var(--bubblegum),var(--purple2))}
.var-fill.over{background:linear-gradient(90deg,var(--red),var(--peach))}
.var-status{font-size:.63rem;color:var(--text3);font-family:var(--mono);text-align:right}

/* Balance Tracker */
.bt{background:linear-gradient(140deg,rgba(255,107,181,.11),rgba(176,96,240,.09),rgba(255,180,220,.07));border:1.5px solid rgba(255,95,174,.28);border-radius:24px;padding:24px;margin-bottom:28px;animation:fadeUp .5s ease both;backdrop-filter:blur(16px);box-shadow:0 12px 42px rgba(255,95,174,.14),0 4px 14px rgba(176,96,240,.10),inset 0 1px 0 rgba(255,255,255,.65)}
.bt-title{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.15em;color:var(--purple2);font-family:var(--mono);margin-bottom:16px;display:flex;align-items:center;gap:6px}
.bt-title::after{content:'✨';font-size:.9rem}
.bt-inputs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.bt-input-group{display:flex;flex-direction:column;gap:5px}
.bt-input-lbl{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text2);font-family:var(--mono)}
.bt-field{background:rgba(255,255,255,.78);border:1.5px solid var(--border);border-radius:12px;padding:10px 13px;font-family:var(--mono);font-size:.92rem;color:var(--text);outline:none;width:100%;transition:all .2s;backdrop-filter:blur(8px)}
.bt-field:focus{border-color:var(--pink2);box-shadow:0 0 0 3px var(--pink-glow)}
.bt-field.start{border-color:rgba(245,168,0,.4);background:rgba(245,168,0,.06)}
.bt-available-row{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.55);border:1.5px solid rgba(255,95,174,.15);border-radius:12px;padding:10px 16px;margin-bottom:16px;backdrop-filter:blur(8px)}
.bt-available-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text2);font-family:var(--mono)}
.bt-available-val{font-family:'Playfair Display',serif;font-size:1.15rem;font-weight:900;color:var(--text)}
.bt-divider{height:1.5px;background:linear-gradient(90deg,rgba(255,95,174,.35),rgba(176,96,240,.25),transparent);border-radius:999px;margin:16px 0}
.bt-running-lbl{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.15em;color:var(--text3);font-family:var(--mono);text-align:center;margin-bottom:6px}
.bt-running{font-family:'Playfair Display',serif;font-size:3rem;font-weight:900;text-align:center;line-height:1;transition:color .25s}
.bt-running.great{color:var(--mint-deep)}
.bt-running.ok{color:var(--amber)}
.bt-running.low{color:var(--peach)}
.bt-running.danger{color:var(--red)}
.bt-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.bt-stat{background:rgba(255,255,255,.65);border:1.5px solid rgba(255,95,174,.12);border-radius:16px;padding:12px 8px;text-align:center;backdrop-filter:blur(8px);transition:transform .18s}
.bt-stat:hover{transform:translateY(-2px)}
.bt-stat-lbl{font-size:.57rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);font-family:var(--mono);margin-bottom:6px}
.bt-stat-val{font-family:'Playfair Display',serif;font-size:.95rem;font-weight:900;color:var(--text)}
.bt-stat-val.green{color:var(--mint-deep)}
.bt-stat-val.amber{color:var(--amber)}
.bt-stat-val.red{color:var(--red)}
@media(max-width:600px){.bt-inputs{grid-template-columns:1fr 1fr}.bt-stats{grid-template-columns:1fr 1fr}}

/* Variable spending rows */
.var-row{flex-direction:column;align-items:stretch;gap:8px;padding:13px 15px}
.var-top{display:flex;align-items:center;gap:10px}
.var-controls{display:flex;align-items:center;gap:8px;margin-left:auto;flex-shrink:0}
.var-budget-lbl{font-family:var(--mono);font-size:.67rem;color:var(--text3);white-space:nowrap}
.var-prefix{font-family:var(--mono);font-size:.72rem;color:var(--text3)}
.var-input{width:72px;background:rgba(255,255,255,.78);border:1.5px solid var(--border);border-radius:10px;padding:6px 9px;font-family:var(--mono);font-size:.8rem;color:var(--text);outline:none;text-align:right;transition:all .2s}
.var-input:focus{border-color:var(--pink2);box-shadow:0 0 0 2px var(--pink-glow)}
.var-bottom{display:flex;align-items:center;gap:10px;padding-left:30px}
.var-bar{flex:1;height:5px;background:rgba(176,96,240,.1);border-radius:999px;overflow:hidden}
.var-fill{height:100%;border-radius:999px;transition:width .4s cubic-bezier(.34,1.4,.64,1);background:linear-gradient(90deg,var(--pink),var(--bubblegum),var(--purple2))}
.var-fill.over{background:linear-gradient(90deg,var(--red),var(--peach))}

function getState(){try{return JSON.parse(localStorage.getItem('enid_finance_v2')||'{}')}catch{return{}}}
function saveState(s){localStorage.setItem('enid_finance_v2',JSON.stringify(s))}
function getCheck(pid,idx){return(getState()[pid]?.c||{})[idx]||false}
function setCheck(pid,idx,val){const s=getState();if(!s[pid])s[pid]={};if(!s[pid].c)s[pid].c={};s[pid].c[idx]=val;saveState(s)}
function getSpent(pid,idx){return(getState()[pid]?.s||{})[idx]||''}
function setSpent(pid,idx,val){const s=getState();if(!s[pid])s[pid]={};if(!s[pid].s)s[pid].s={};s[pid].s[idx]=val;saveState(s)}
function getSched(pid,idx){return(getState()[pid]?.sc||{})[idx]||false}
function setSched(pid,idx,val){const s=getState();if(!s[pid])s[pid]={};if(!s[pid].sc)s[pid].sc={};s[pid].sc[idx]=val;saveState(s)}
function getCleared(pid,idx){return(getState()[pid]?.cl||{})[idx]||false}
function setCleared(pid,idx,val){const s=getState();if(!s[pid])s[pid]={};if(!s[pid].cl)s[pid].cl={};s[pid].cl[idx]=val;saveState(s)}
function getStartBal(pid){return(getState()[pid]?.sb)??''}
function setStartBal(pid,val){const s=getState();if(!s[pid])s[pid]={};s[pid].sb=val;saveState(s)}
function getBBSActual(pid,def){const v=getState()[pid]?.bbs;return v!==undefined&&v!==''?v:def}
function setBBSActual(pid,val){const s=getState();if(!s[pid])s[pid]={};s[pid].bbs=val;saveState(s)}
function getKTActual(pid){return(getState()[pid]?.kt)??''}
function setKTActual(pid,val){const s=getState();if(!s[pid])s[pid]={};s[pid].kt=val;saveState(s)}

// ─────────────────────────────────────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────────────────────────────────────
function fmt(n){return'$'+n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',')}
function fmtSigned(n){return n>=0?fmt(n):'('+fmt(Math.abs(n))+')'}
function aprCls(apr){if(!apr)return'';const n=parseFloat(apr);if(n===0)return'apr-zero';if(n>=29)return'apr-crit';if(n>=25)return'apr-high';if(n>=20)return'apr-mid';return'apr-low'}
const CAT_META={cc:{icon:'💳',title:'Credit Cards'},loan:{icon:'🏦',title:'Loans'},affirm:{icon:'🛒',title:'BNPL / Affirm'},sub:{icon:'📱',title:'Subscriptions'},life:{icon:'🌿',title:'Life'}};

// ─────────────────────────────────────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────────────────────────────────────
let activePid = PERIODS.find(p=>p.current)?.id || PERIODS[0].id;

function renderTabs(){
  document.getElementById('periodTabs').innerHTML = PERIODS.map(p=>{
    let cls='period-tab';
    if(p.id===activePid)cls+=' active';
    if(p.current)cls+=' is-current';
    return`<button class="${cls}" onclick="switchPeriod('${p.id}')" title="${p.dates}">${p.label}</button>`;
  }).join('');
}

function renderPeriod(pid){
  const p=PERIODS.find(x=>x.id===pid);
  if(!p)return;
  const cats=['cc','loan','affirm','sub','life'];
  let html=renderBalanceTracker(pid,p);
  cats.forEach(cat=>{
    const items=p.items.filter(i=>i.cat===cat);
    if(!items.length)return;
    const m=CAT_META[cat];
    const catTotal=items.filter(i=>!i.paidOff).reduce((s,i)=>s+(i.amount||0),0);
    html+=`<div class="cat-section" data-cat="${cat}">
      <div class="cat-header">
        <span class="cat-icon">${m.icon}</span>
        <span class="cat-title">${m.title}</span>
        <div class="cat-line"></div>
        <span class="cat-total">${fmt(catTotal)}</span>
      </div>
      ${(cat==='cc'||cat==='affirm')?renderCatProgress(pid,p,cat):''}
      <div class="items-grid">`;
    items.forEach(item=>{
      const idx=p.items.indexOf(item);
      html+=item.paidOff?renderPaidOff(item):item.variable?renderVariable(item,pid,idx):renderFixed(item,pid,idx);
    });
    html+=`</div></div>`;
  });
  document.getElementById('periodContent').innerHTML=html;
}

function computeBalance(pid,p){
  const sb=parseFloat(getStartBal(pid))||0;
  const bbs=Number(getBBSActual(pid,p.income.bbs))||p.income.bbs;
  const kt=parseFloat(getKTActual(pid))||0;
  const avail=sb+bbs+kt;
  let out=0,owed=0;
  p.items.forEach((item,idx)=>{
    if(item.paidOff)return;
    if(item.variable){
      const spent=parseFloat(getSpent(pid,idx))||0;
      out+=spent;
      owed+=Math.max(0,item.amount-spent);
    } else if(item.cat==='cc'){
      if(getCleared(pid,idx))out+=item.amount;
      else owed+=item.amount;
    } else {
      if(getCheck(pid,idx))out+=item.amount;
      else owed+=item.amount;
    }
  });
  const running=avail-out;
  const savings=running-owed;
  return{sb,bbs,kt,avail,out,owed,running,savings};
}

function renderBalanceTracker(pid,p){
  const c=computeBalance(pid,p);
  const runCls=c.running>=500?'great':c.running>=200?'ok':c.running>=0?'low':'danger';
  const saveCls=c.savings>=0?'green':'red';
  const owedCls=c.owed>500?'red':'amber';
  const bbsVal=getBBSActual(pid,p.income.bbs);
  const ktVal=getKTActual(pid);
  return`<div class="bt" id="bt-${pid}">
    <div class="bt-title">💰 Balance Tracker — ${p.dates}</div>
    <div class="bt-inputs">
      <div class="bt-input-group">
        <div class="bt-input-lbl">Starting Balance</div>
        <input class="bt-field start" type="number" placeholder="0.00" value="${getStartBal(pid)}" step="0.01" oninput="setStartBal('${pid}',this.value);refreshBalance('${pid}')">
      </div>
      <div class="bt-input-group">
        <div class="bt-input-lbl">BBS Paycheck</div>
        <input class="bt-field" type="number" placeholder="${p.income.bbs}" value="${bbsVal}" step="0.01" oninput="setBBSActual('${pid}',this.value);refreshBalance('${pid}')">
      </div>
      <div class="bt-input-group">
        <div class="bt-input-lbl">KT Paycheck</div>
        <input class="bt-field" type="number" placeholder="0.00" value="${ktVal}" step="0.01" oninput="setKTActual('${pid}',this.value);refreshBalance('${pid}')">
      </div>
    </div>
    <div class="bt-available-row">
      <span class="bt-available-lbl">Total Available</span>
      <span class="bt-available-val" id="bt-avail-${pid}">${fmt(c.avail)}</span>
    </div>
    <div class="bt-divider"></div>
    <div class="bt-running-lbl">Running Balance</div>
    <div class="bt-running ${runCls}" id="bt-run-${pid}">${fmt(c.running)}</div>
    <div class="bt-stats">
      <div class="bt-stat"><div class="bt-stat-lbl">Paid Out</div><div class="bt-stat-val" id="bt-out-${pid}">${fmt(c.out)}</div></div>
      <div class="bt-stat"><div class="bt-stat-lbl">Still Owed</div><div class="bt-stat-val ${owedCls}" id="bt-owed-${pid}">${fmt(c.owed)}</div></div>
      <div class="bt-stat"><div class="bt-stat-lbl">Period</div><div class="bt-stat-val" style="font-size:.75rem;font-weight:700;color:var(--text2)">${p.label}</div></div>
      <div class="bt-stat"><div class="bt-stat-lbl">Est. Savings</div><div class="bt-stat-val ${saveCls}" id="bt-save-${pid}">${fmtSigned(c.savings)}</div></div>
    </div>
  </div>`;
}

function refreshBalance(pid){
  const p=PERIODS.find(x=>x.id===pid);
  if(!p)return;
  const c=computeBalance(pid,p);
  const runEl=document.getElementById(`bt-run-${pid}`);
  if(!runEl)return;
  const availEl=document.getElementById(`bt-avail-${pid}`);
  const outEl=document.getElementById(`bt-out-${pid}`);
  const owedEl=document.getElementById(`bt-owed-${pid}`);
  const saveEl=document.getElementById(`bt-save-${pid}`);
  if(availEl)availEl.textContent=fmt(c.avail);
  runEl.textContent=fmt(c.running);
  runEl.className='bt-running '+(c.running>=500?'great':c.running>=200?'ok':c.running>=0?'low':'danger');
  if(outEl)outEl.textContent=fmt(c.out);
  if(owedEl){owedEl.textContent=fmt(c.owed);owedEl.className='bt-stat-val '+(c.owed>500?'red':'amber')}
  if(saveEl){saveEl.textContent=fmtSigned(c.savings);saveEl.className='bt-stat-val '+(c.savings>=0?'green':'red')}
}

function computeCatProgress(pid,p,cat){
  const items=p.items.filter(i=>i.cat===cat&&!i.paidOff&&!i.variable);
  const total=items.length;
  const totalAmt=items.reduce((s,i)=>s+(i.amount||0),0);
  let done=0,doneAmt=0;
  items.forEach(item=>{
    const idx=p.items.indexOf(item);
    const cleared=cat==='cc'?getCleared(pid,idx):getCheck(pid,idx);
    if(cleared){done++;doneAmt+=item.amount||0;}
  });
  return{total,totalAmt,done,doneAmt,leftAmt:totalAmt-doneAmt,pct:total>0?(done/total)*100:0};
}

function renderCatProgress(pid,p,cat){
  const c=computeCatProgress(pid,p,cat);
  const lbl=cat==='cc'?'cleared':'paid';
  return`<div class="cat-progress" id="cp-${pid}-${cat}">
    <div class="cp-bar"><div class="cp-fill${c.pct===100?' full':''}" id="cpf-${pid}-${cat}" style="width:${c.pct}%"></div></div>
    <span class="cp-text" id="cpt-${pid}-${cat}"><span class="cp-count">${c.done}/${c.total}</span> ${lbl} · <span class="cp-done">${fmt(c.doneAmt)}</span> paid · <span class="cp-left">${fmt(c.leftAmt)}</span> left</span>
  </div>`;
}

function refreshCatProgress(pid,cat){
  const p=PERIODS.find(x=>x.id===pid);
  if(!p)return;
  const c=computeCatProgress(pid,p,cat);
  const fillEl=document.getElementById(`cpf-${pid}-${cat}`);
  const textEl=document.getElementById(`cpt-${pid}-${cat}`);
  const lbl=cat==='cc'?'cleared':'paid';
  if(fillEl){fillEl.style.width=c.pct+'%';fillEl.className='cp-fill'+(c.pct===100?' full':'');}
  if(textEl)textEl.innerHTML=`<span class="cp-count">${c.done}/${c.total}</span> ${lbl} · <span class="cp-done">${fmt(c.doneAmt)}</span> paid · <span class="cp-left">${fmt(c.leftAmt)}</span> left`;
}

function renderPaidOff(item){
  return`<div class="cloud-card paid-off-cloud">
    <div class="cloud-amount cleared-lbl">✅ CLEARED</div>
    <div class="cloud-name">${item.name}</div>
    ${item.note?`<div class="cloud-note">${item.note}</div>`:''}
  </div>`;
}

function renderFixed(item,pid,idx){
  if(item.cat==='cc') return renderCC(item,pid,idx);
  const checked=getCheck(pid,idx);
  const aprBadge=item.apr?`<span class="apr-badge ${aprCls(item.apr)}">${item.apr}</span>`:'';
  const finalBadge=item.final?`<span class="final-badge">🎉 FINAL</span>`:'';
  return`<div class="cloud-card ${checked?'checked':''}" id="row-${pid}-${idx}">
    <div class="cloud-check-wrap"><div class="item-check ${checked?'done':''}" onclick="toggleCheck('${pid}',${idx},this)"></div></div>
    <div class="cloud-amount ${item.final?'final-pay':''}">${fmt(item.amount)}</div>
    <div class="cloud-name">${item.name}</div>
    ${item.note?`<div class="cloud-note">${item.note}</div>`:''}
    <div class="cloud-footer">
      <span class="item-due">${item.due}</span>
      ${aprBadge}${finalBadge}
    </div>
  </div>`;
}

function renderCC(item,pid,idx){
  const sched=getSched(pid,idx);
  const cleared=getCleared(pid,idx);
  const aprBadge=item.apr?`<span class="apr-badge ${aprCls(item.apr)}">${item.apr}</span>`:'';
  return`<div class="cloud-card ${cleared?'cc-cleared':''}" id="row-${pid}-${idx}">
    <div class="cloud-amount">${fmt(item.amount)}</div>
    <div class="cloud-name">${item.name}</div>
    ${item.note?`<div class="cloud-note">${item.note}</div>`:''}
    <div class="cloud-footer">
      <span class="item-due">${item.due}</span>
      ${aprBadge}
    </div>
    <div class="cc-checks">
      <div class="cc-check-item" onclick="toggleSched('${pid}',${idx},this)" title="Mark as scheduled">
        <div class="cc-cb ${sched?'sched':''}"></div>
        <span class="cc-cb-lbl">Sched</span>
      </div>
      <div class="cc-check-item" onclick="toggleCleared('${pid}',${idx},this)" title="Mark as cleared">
        <div class="cc-cb ${cleared?'cleared':''}"></div>
        <span class="cc-cb-lbl">Cleared</span>
      </div>
    </div>
  </div>`;
}

function renderVariable(item,pid,idx){
  const checked=getCheck(pid,idx);
  const spent=getSpent(pid,idx);
  const spentNum=parseFloat(spent)||0;
  const budget=item.amount;
  const pct=Math.min(budget>0?(spentNum/budget)*100:0,100);
  const over=spentNum>budget;
  const statusTxt=spentNum>0?(over?`⚠️ $${(spentNum-budget).toFixed(2)} over`:`$${(budget-spentNum).toFixed(2)} left`):'not started';
  return`<div class="cloud-card ${checked?'checked':''}" id="row-${pid}-${idx}">
    <div class="cloud-check-wrap"><div class="item-check ${checked?'done':''}" onclick="toggleCheck('${pid}',${idx},this)"></div></div>
    <div class="cloud-name">${item.name}</div>
    ${item.note?`<div class="cloud-note">${item.note}</div>`:''}
    <div class="var-budget-lbl">Budget: ${fmt(budget)}</div>
    <div class="var-input-row">
      <span class="var-prefix">$</span>
      <input class="var-input" type="number" placeholder="0.00" value="${spent}" step="0.01" min="0"
        oninput="updateSpent('${pid}',${idx},this,${budget})">
    </div>
    <div class="var-bar"><div class="var-fill ${over?'over':''}" style="width:${pct}%" id="vf-${pid}-${idx}"></div></div>
    <div class="var-status" id="vs-${pid}-${idx}">${statusTxt}</div>
  </div>`;
}

// ─────────────────────────────────────────────────────────────────────────────
// EVENTS
// ─────────────────────────────────────────────────────────────────────────────
function toggleCheck(pid,idx,el){
  const row=document.getElementById(`row-${pid}-${idx}`);
  const newVal=!getCheck(pid,idx);
  setCheck(pid,idx,newVal);
  el.classList.toggle('done',newVal);
  row.classList.toggle('checked',newVal);
  refreshCatProgress(pid,'affirm');
  refreshBalance(pid);
}

function toggleSched(pid,idx,el){
  const newVal=!getSched(pid,idx);
  setSched(pid,idx,newVal);
  el.querySelector('.cc-cb').classList.toggle('sched',newVal);
}

function toggleCleared(pid,idx,el){
  const row=document.getElementById(`row-${pid}-${idx}`);
  const newVal=!getCleared(pid,idx);
  setCleared(pid,idx,newVal);
  el.querySelector('.cc-cb').classList.toggle('cleared',newVal);
  row.classList.toggle('cc-cleared',newVal);
  // auto-mark scheduled too when cleared
  if(newVal){
    setSched(pid,idx,true);
    const schedEl=row.querySelector('.cc-check-item:first-child .cc-cb');
    if(schedEl)schedEl.classList.add('sched');
  }
  refreshCatProgress(pid,'cc');
  refreshBalance(pid);
}

function updateSpent(pid,idx,input,budget){
  const val=input.value;
  setSpent(pid,idx,val);
  const spentNum=parseFloat(val)||0;
  const pct=Math.min(budget>0?(spentNum/budget)*100:0,100);
  const over=spentNum>budget;
  const fill=document.getElementById(`vf-${pid}-${idx}`);
  const status=document.getElementById(`vs-${pid}-${idx}`);
  if(fill){fill.style.width=pct+'%';fill.className='var-fill'+(over?' over':'');}
  if(status)status.textContent=spentNum>0?(over?`⚠️ $${(spentNum-budget).toFixed(2)} over`:`$${(budget-spentNum).toFixed(2)} left`):'not started';
  refreshBalance(pid);
}

function switchPeriod(pid){
  activePid=pid;
  renderTabs();
  renderPeriod(pid);
  window.scrollTo({top:0,behavior:'smooth'});
}

// ─────────────────────────────────────────────────────────────────────────────
// INIT — scroll active tab into view
// ─────────────────────────────────────────────────────────────────────────────
renderTabs();
renderPeriod(activePid);
setTimeout(()=>{
  const el=document.querySelector('.period-tab.active');
  if(el)el.scrollIntoView({inline:'center',behavior:'smooth'});
},100);
</script>
</body>
</html>
