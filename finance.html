  --bg:#060D08;--bg2:#0A1510;--bg3:#0F1E14;

  --red:#EF4444;--red-dim:rgba(239,68,68,.1);
  --amber:#FCD34D;--amber-dim:rgba(252,211,77,.08);
  --pink:#E84EA0;--pink-dim:rgba(232,78,160,.1);
  --text:#E8F5E8;--text2:#9DC49D;--text3:#4A6B4A;
  --border:rgba(255,255,255,.07);--border2:rgba(29,185,84,.2);
  --card:rgba(255,255,255,.04);--card2:rgba(255,255,255,.07);
  --shadow:0 4px 24px rgba(0,0,0,.5);
  --mono:'DM Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{max-width:100vw;overflow-x:hidden;scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:0;background:
  radial-gradient(ellipse 70% 50% at 5% 5%,rgba(29,185,84,.12) 0%,transparent 55%),
  radial-gradient(ellipse 50% 40% at 95% 15%,rgba(201,148,58,.08) 0%,transparent 50%),
  radial-gradient(ellipse 60% 50% at 50% 95%,rgba(29,185,84,.07) 0%,transparent 55%),
  linear-gradient(160deg,#060D08 0%,#08120A 50%,#040908 100%);pointer-events:none}
body::after{content:'';position:fixed;inset:0;z-index:0;opacity:.025;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");pointer-events:none}
.app{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:0 32px 100px}

/* Nav */
.header-nav{display:flex;align-items:center;justify-content:space-between;padding:28px 0 0;animation:fadeDown .6s ease both}
.back-btn{display:inline-flex;align-items:center;gap:7px;padding:8px 18px;border-radius:8px;border:1px solid var(--border2);background:var(--green-dim);color:var(--green2);font-size:.78rem;font-weight:600;text-decoration:none;font-family:'DM Sans',sans-serif;transition:all .2s}
.back-btn:hover{background:var(--green-glow);transform:translateY(-1px)}
.nav-links{display:flex;gap:8px}
.nav-lnk{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text2);font-size:.75rem;font-weight:500;text-decoration:none;transition:all .2s}
.nav-lnk:hover{border-color:var(--border2);color:var(--green2)}

/* Hero */
.hero{padding:28px 0 16px;animation:fadeDown .7s .05s ease both}
.hero-eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--brass);margin-bottom:8px;font-family:var(--mono)}
.hero-title{font-family:'Syne',sans-serif;font-size:clamp(1.8rem,4vw,2.8rem);font-weight:800;color:var(--text);line-height:1.05}
.hero-title span{color:var(--green2)}
.hero-sub{font-size:.85rem;color:var(--text2);margin-top:6px}

/* Period tabs */
.period-tabs-wrap{position:sticky;top:0;z-index:10;background:linear-gradient(to bottom,var(--bg) 85%,transparent);padding:10px 0 0;margin-bottom:20px}
.period-tabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.period-tabs::-webkit-scrollbar{display:none}
.period-tab{flex-shrink:0;padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text3);font-size:.78rem;font-weight:700;cursor:pointer;font-family:var(--mono);transition:all .18s;white-space:nowrap;position:relative}
.period-tab:hover{border-color:var(--border2);color:var(--text2)}
.period-tab.active{border-color:var(--green);background:var(--green-dim);color:var(--green2)}
.period-tab.is-current::after{content:'NOW';position:absolute;top:-5px;right:-4px;font-size:.45rem;font-weight:900;background:var(--brass);color:#000;border-radius:3px;padding:1px 4px;letter-spacing:.05em}

/* Income bar */
.income-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 20px;margin-bottom:22px;animation:fadeUp .5s ease both}
.ib-item{text-align:center}
.ib-label{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);font-family:var(--mono);margin-bottom:4px}
.ib-val{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:800}
.ib-val.green{color:var(--green2)}
.ib-val.red{color:var(--red)}
.ib-val.gold{color:var(--brass2);font-size:.85rem;padding-top:3px;display:block}

/* Category section */
.cat-section{margin-bottom:26px;animation:fadeUp .4s ease both}
.cat-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cat-icon{font-size:.95rem}
.cat-title{font-family:'Syne',sans-serif;font-size:.76rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--text2)}
.cat-line{flex:1;height:1px;background:linear-gradient(90deg,var(--border2),transparent)}
.cat-total{font-family:var(--mono);font-size:.72rem;color:var(--text3)}

/* Item rows */
.item-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:var(--card);margin-bottom:5px;transition:all .18s}
.item-row:hover{border-color:rgba(29,185,84,.2)}
.item-row.checked{opacity:.45;background:transparent}
.item-row.paid-off{opacity:.38;border-style:dashed;border-color:var(--green);pointer-events:none}

/* Checkbox */
.item-check{width:18px;height:18px;min-width:18px;border:2px solid var(--text3);border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .18s;background:transparent;user-select:none}
.item-check.done{border-color:var(--green2);background:var(--green-dim)}
.item-check.done::after{content:'✓';font-size:.7rem;color:var(--green2);font-weight:800}
.item-name{font-size:.83rem;font-weight:600;color:var(--text);flex:1;min-width:0}
.item-note{display:block;font-size:.65rem;color:var(--text3);font-weight:400;margin-top:1px;font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-due{font-family:var(--mono);font-size:.65rem;color:var(--text3);white-space:nowrap}
.item-amount{font-family:'Syne',sans-serif;font-size:.93rem;font-weight:800;color:var(--text);text-align:right;min-width:56px}
.item-amount.final-pay{color:var(--green2)}

/* APR badges */
.apr-badge{font-family:var(--mono);font-size:.62rem;font-weight:700;padding:2px 7px;border-radius:4px;white-space:nowrap}
.apr-crit{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.2)}
.apr-high{background:rgba(249,115,22,.12);color:#FB923C;border:1px solid rgba(249,115,22,.2)}
.apr-mid{background:rgba(252,211,77,.1);color:var(--amber);border:1px solid rgba(252,211,77,.2)}
.apr-low{background:rgba(132,204,22,.1);color:#A3E635;border:1px solid rgba(132,204,22,.2)}
.apr-zero{background:var(--green-dim);color:var(--green2);border:1px solid var(--border2)}
.final-badge{font-size:.58rem;font-weight:700;padding:2px 6px;border-radius:4px;background:var(--green-dim);color:var(--green2);border:1px solid var(--border2);white-space:nowrap}

/* Variable spending rows */
.var-row{flex-direction:column;align-items:stretch;gap:8px;padding:12px 14px}
.var-top{display:flex;align-items:center;gap:10px}
.var-controls{display:flex;align-items:center;gap:8px;margin-left:auto;flex-shrink:0}
.var-budget-lbl{font-family:var(--mono);font-size:.67rem;color:var(--text3);white-space:nowrap}
.var-prefix{font-family:var(--mono);font-size:.72rem;color:var(--text3)}
.var-input{width:68px;background:rgba(255,255,255,.07);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-family:var(--mono);font-size:.8rem;color:var(--text);outline:none;text-align:right;transition:border-color .2s}
.var-input:focus{border-color:var(--border2)}
.var-bottom{display:flex;align-items:center;gap:10px;padding-left:28px}
.var-bar{flex:1;height:5px;background:rgba(255,255,255,.07);border-radius:999px;overflow:hidden}
.var-fill{height:100%;border-radius:999px;transition:width .35s ease;background:linear-gradient(90deg,var(--green),var(--green2))}
.var-fill.over{background:linear-gradient(90deg,var(--red),#F97316)}
.var-status{font-size:.65rem;color:var(--text3);font-family:var(--mono);white-space:nowrap;min-width:90px;text-align:right}

/* Period summary */
.period-summary{background:linear-gradient(135deg,rgba(29,185,84,.06),rgba(201,148,58,.04));border:1px solid var(--border2);border-radius:14px;padding:18px 20px;margin-top:6px;animation:fadeUp .4s ease both}
.ps-title{font-family:'Syne',sans-serif;font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--text2);margin-bottom:12px}
.ps-rows{display:flex;flex-direction:column;gap:7px}
.ps-row{display:flex;justify-content:space-between;align-items:center;font-size:.8rem}
.ps-row-label{color:var(--text2);font-family:var(--mono)}
.ps-row-val{font-family:'Syne',sans-serif;font-weight:700;color:var(--text)}
.ps-divider{height:1px;background:var(--border);margin:2px 0}
.ps-total .ps-row-label,.ps-total .ps-row-val{font-size:.88rem}
.ps-surplus.pos .ps-row-val{color:var(--green2)}
.ps-surplus.neg .ps-row-val{color:var(--red)}
.ps-row-val.green{color:var(--green2)}

@keyframes fadeDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

@media(max-width:600px){
  .app{padding:0 14px 80px}
  .income-bar{grid-template-columns:1fr 1fr}
  .income-bar .ib-item:last-child{display:none}
}
</style>

// ─────────────────────────────────────────────────────────────────────────────
// STATE (localStorage)
// ─────────────────────────────────────────────────────────────────────────────
function getState(){try{return JSON.parse(localStorage.getItem('enid_finance_v2')||'{}')}catch{return{}}}
function saveState(s){localStorage.setItem('enid_finance_v2',JSON.stringify(s))}
function getCheck(pid,idx){return(getState()[pid]?.c||{})[idx]||false}
function setCheck(pid,idx,val){const s=getState();if(!s[pid])s[pid]={};if(!s[pid].c)s[pid].c={};s[pid].c[idx]=val;saveState(s)}
function getSpent(pid,idx){return(getState()[pid]?.s||{})[idx]||''}
function setSpent(pid,idx,val){const s=getState();if(!s[pid])s[pid]={};if(!s[pid].s)s[pid].s={};s[pid].s[idx]=val;saveState(s)}

// ─────────────────────────────────────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────────────────────────────────────
function fmt(n){return'$'+n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',')}
function aprCls(apr){if(!apr)return'';const n=parseFloat(apr);if(n===0)return'apr-zero';if(n>=29)return'apr-crit';if(n>=25)return'apr-high';if(n>=20)return'apr-mid';return'apr-low'}
const CAT_META={cc:{icon:'💳',title:'Credit Cards'},loan:{icon:'🏦',title:'Loans'},affirm:{icon:'🛒',title:'BNPL / Affirm'},sub:{icon:'📱',title:'Subscriptions'},life:{icon:'🌿',title:'Life'}};

// ─────────────────────────────────────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────────────────────────────────────
let activePid = PERIODS.find(p=>p.current)?.id || PERIODS[0].id;

function renderTabs(){
  document.getElementById('periodTabs').innerHTML = PERIODS.map(p=>{
    let cls='period-tab';
    if(p.id===activePid)cls+=' active';
    if(p.current)cls+=' is-current';
    return`<button class="${cls}" onclick="switchPeriod('${p.id}')" title="${p.dates}">${p.label}</button>`;
  }).join('');
}

function renderPeriod(pid){
  const p=PERIODS.find(x=>x.id===pid);
  if(!p)return;
  const income=p.income.bbs+p.income.kt;
  const activeItems=p.items.filter(i=>!i.paidOff);
  const fixedItems=activeItems.filter(i=>!i.variable);
  const totalFixed=fixedItems.reduce((s,i)=>s+(i.amount||0),0);
  const surplus=income-totalFixed;

  // Group by category
  const cats=['cc','loan','affirm','sub','life'];
  let html=`
    <div class="income-bar">
      <div class="ib-item"><div class="ib-label">💵 Est. Income</div><div class="ib-val green">${fmt(income)}</div></div>
      <div class="ib-item"><div class="ib-label">📋 Fixed Due</div><div class="ib-val">${fmt(totalFixed)}</div></div>
      <div class="ib-item"><div class="ib-label">📅 Pay Period</div><div class="ib-val gold">${p.dates}</div></div>
    </div>`;

  cats.forEach(cat=>{
    const items=p.items.filter(i=>i.cat===cat);
    if(!items.length)return;
    const m=CAT_META[cat];
    const catTotal=items.filter(i=>!i.paidOff).reduce((s,i)=>s+(i.amount||0),0);
    html+=`<div class="cat-section">
      <div class="cat-header">
        <span class="cat-icon">${m.icon}</span>
        <span class="cat-title">${m.title}</span>
        <div class="cat-line"></div>
        <span class="cat-total">${fmt(catTotal)}</span>
      </div>`;
    items.forEach(item=>{
      const idx=p.items.indexOf(item);
      html+=item.paidOff?renderPaidOff(item):item.variable?renderVariable(item,pid,idx):renderFixed(item,pid,idx);
    });
    html+=`</div>`;
  });

  html+=`
    <div class="period-summary">
      <div class="ps-title">📊 Period Summary</div>
      <div class="ps-rows">
        <div class="ps-row"><span class="ps-row-label">BBS Salary</span><span class="ps-row-val">${fmt(p.income.bbs)}</span></div>
        <div class="ps-row"><span class="ps-row-label">KT Hourly (estimate)</span><span class="ps-row-val">${fmt(p.income.kt)}</span></div>
        <div class="ps-divider"></div>
        <div class="ps-row ps-total"><span class="ps-row-label">Total Est. Income</span><span class="ps-row-val green">${fmt(income)}</span></div>
        <div class="ps-row"><span class="ps-row-label">Fixed Payments Due</span><span class="ps-row-val">${fmt(totalFixed)}</span></div>
        <div class="ps-divider"></div>
        <div class="ps-row ps-total ps-surplus ${surplus>=0?'pos':'neg'}">
          <span class="ps-row-label">Est. Surplus / (Deficit)</span>
          <span class="ps-row-val">${surplus>=0?fmt(surplus):'('+fmt(Math.abs(surplus))+')'}</span>
        </div>
      </div>
    </div>`;

  document.getElementById('periodContent').innerHTML=html;
}

function renderPaidOff(item){
  return`<div class="item-row paid-off">
    <div class="item-check done"></div>
    <div class="item-name">${item.name}${item.note?`<span class="item-note">${item.note}</span>`:''}</div>
    <div class="item-amount" style="color:var(--green2);font-size:.8rem">✅ CLEARED</div>
  </div>`;
}

function renderFixed(item,pid,idx){
  const checked=getCheck(pid,idx);
  const aprBadge=item.apr?`<span class="apr-badge ${aprCls(item.apr)}">${item.apr}</span>`:'';
  const finalBadge=item.final?`<span class="final-badge">🎉 FINAL</span>`:'';
  return`<div class="item-row ${checked?'checked':''}" id="row-${pid}-${idx}">
    <div class="item-check ${checked?'done':''}" onclick="toggleCheck('${pid}',${idx},this)"></div>
    <div class="item-name">${item.name}${item.note?`<span class="item-note">${item.note}</span>`:''}</div>
    ${aprBadge}${finalBadge}
    <div class="item-due">${item.due}</div>
    <div class="item-amount ${item.final?'final-pay':''}">${fmt(item.amount)}</div>
  </div>`;
}

function renderVariable(item,pid,idx){
  const checked=getCheck(pid,idx);
  const spent=getSpent(pid,idx);
  const spentNum=parseFloat(spent)||0;
  const budget=item.amount;
  const pct=Math.min(budget>0?(spentNum/budget)*100:0,100);
  const over=spentNum>budget;
  const statusTxt=spentNum>0?(over?`⚠️ $${(spentNum-budget).toFixed(2)} over`:`$${(budget-spentNum).toFixed(2)} left`):'not started';
  return`<div class="item-row var-row ${checked?'checked':''}" id="row-${pid}-${idx}">
    <div class="var-top">
      <div class="item-check ${checked?'done':''}" onclick="toggleCheck('${pid}',${idx},this)"></div>
      <div class="item-name">${item.name}${item.note?`<span class="item-note">${item.note}</span>`:''}</div>
      <div class="var-controls">
        <span class="var-budget-lbl">Budget: ${fmt(budget)}</span>
        <span class="var-prefix">· $</span>
        <input class="var-input" type="number" placeholder="0.00" value="${spent}" step="0.01" min="0"
          oninput="updateSpent('${pid}',${idx},this,${budget})">
      </div>
    </div>
    <div class="var-bottom">
      <div class="var-bar"><div class="var-fill ${over?'over':''}" style="width:${pct}%" id="vf-${pid}-${idx}"></div></div>
      <div class="var-status" id="vs-${pid}-${idx}">${statusTxt}</div>
    </div>
  </div>`;
}

// ─────────────────────────────────────────────────────────────────────────────
// EVENTS
// ─────────────────────────────────────────────────────────────────────────────
function toggleCheck(pid,idx,el){
  const row=document.getElementById(`row-${pid}-${idx}`);
  const newVal=!getCheck(pid,idx);
  setCheck(pid,idx,newVal);
  el.classList.toggle('done',newVal);
  row.classList.toggle('checked',newVal);
}

function updateSpent(pid,idx,input,budget){
  const val=input.value;
  setSpent(pid,idx,val);
  const spentNum=parseFloat(val)||0;
  const pct=Math.min(budget>0?(spentNum/budget)*100:0,100);
  const over=spentNum>budget;
  const fill=document.getElementById(`vf-${pid}-${idx}`);
  const status=document.getElementById(`vs-${pid}-${idx}`);
  if(fill){fill.style.width=pct+'%';fill.className='var-fill'+(over?' over':'');}
  if(status)status.textContent=spentNum>0?(over?`⚠️ $${(spentNum-budget).toFixed(2)} over`:`$${(budget-spentNum).toFixed(2)} left`):'not started';
}

function switchPeriod(pid){
  activePid=pid;
  renderTabs();
  renderPeriod(pid);
  window.scrollTo({top:0,behavior:'smooth'});
}

// ─────────────────────────────────────────────────────────────────────────────
// INIT — scroll active tab into view
// ─────────────────────────────────────────────────────────────────────────────
renderTabs();
renderPeriod(activePid);
setTimeout(()=>{
  const el=document.querySelector('.period-tab.active');
  if(el)el.scrollIntoView({inline:'center',behavior:'smooth'});
},100);
</script>
